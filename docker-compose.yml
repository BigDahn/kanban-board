services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
    env_file:
      - ./backend/config.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
    env_file:
      - ./backend/config.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
